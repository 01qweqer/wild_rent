description: "Гайковёрт предназначен для быстрого закручивания и откручивания резьбовых соединений (болтов и гаек). Он также используется для вкручивания и выкручивания глухарей и анкер-шурупов. Гайковёрт часто необходим при ремонте автомобилей (например, при снятии/установке колес), сборке и разборке металлоконструкций."
