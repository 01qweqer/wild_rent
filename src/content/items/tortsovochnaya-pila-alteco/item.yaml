description: "Торцовочная пила предназначена для точного поперечного распила заготовок под различными углами (прямым, наклонным или комбинированным), позволяя делать аккуратные и чистые срезы. Этот инструмент в основном используется для работы с деревом, но с подходящими дисками может применяться для резки пластика и алюминия."
