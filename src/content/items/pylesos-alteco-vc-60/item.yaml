description: "Строительный пылесос ALTECO предназначен для уборки помещений и рабочих мест от большого количества пыли и крупного строительного мусора, таких как бетонная крошка, стружка, стекло и другие остатки материалов. Он также может использоваться для влажной уборки и для совместной работы с электроинструментами, чтобы принудительно удалять пыль непосредственно в процессе работы (например, при сверлении или шлифовке)."
